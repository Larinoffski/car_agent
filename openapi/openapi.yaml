openapi: 3.1.0
info:
  title: car_agent API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /up:
    get:
      summary: Health check
      description: Laravel health route. Returns 500 if the application fails to boot.
      operationId: healthCheck
      responses:
        "200":
          description: The application is up.
          content:
            text/html:
              schema:
                type: string
        "500":
          description: The application failed to boot.
