# Overlay for ENV=production. Deployed environment. Secrets come from the platform, not files.
services:
  app:
    build:
      target: ${APP_RUNTIME:?}-prod
    env_file:
      - envs/production.env
      - path: ${SECRETS_DIR:?}/production.env
        required: false
    environment:
      # Explicit so compose checks it: values coming only through env_file are not validated.
      APP_KEY: ${APP_KEY:?}
