name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [local, test, staging, production]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: make config ENV=${{ matrix.env }}

  pr-title:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          subjectPattern: ^(?![A-Z]).{1,72}$
          subjectPatternError: The subject must start with a lowercase letter and be at most 72 characters.

  test:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: make build ENV=test
      - run: make composer ENV=test CMD=install
      - run: make up ENV=test
      - run: make test ENV=test

  # TODO: enable once make lint is configured (it is a stub that exits 1).
  # lint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: make lint
