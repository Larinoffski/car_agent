# API only, no static assets: every request goes to the Laravel front controller.
# nginx needs no application code; php-fpm resolves the script path in the app container.
server {
    listen 80;
    server_name _;

    location / {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }
}
